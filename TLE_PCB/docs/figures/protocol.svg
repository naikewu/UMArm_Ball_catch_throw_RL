<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 296" width="100%" role="img" aria-label="CAN identifier map and frame layouts" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d55"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4531f"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b3fa0"/></marker></defs>
<text x="0" y="12" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">Identifier map, and the two frames that carry the control loop</text>
<rect x="0" y="26" width="300" height="24" rx="4" fill="#f6efe7" stroke="#b4531f" stroke-width="1.0"/>
<text x="10" y="42" font-size="10" fill="#b4531f" text-anchor="start" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">0x090</text>
<text x="112" y="42" font-size="10" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">broadcast</text>
<text x="312" y="42" font-size="9.6" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">DLC 0 is the sync edge. DLC &gt; 0 is OTA image data.</text>
<rect x="0" y="53" width="300" height="24" rx="4" fill="#f6efe7" stroke="#b4531f" stroke-width="1.0"/>
<text x="10" y="69" font-size="10" fill="#b4531f" text-anchor="start" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">0x091 - 0x098</text>
<text x="112" y="69" font-size="10" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">target table</text>
<text x="312" y="69" font-size="9.6" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">Three actuators per frame, so 24 targets cost 8 frames.</text>
<rect x="0" y="80" width="300" height="24" rx="4" fill="#e8eef7" stroke="#2563a8" stroke-width="1.0"/>
<text x="10" y="96" font-size="10" fill="#2563a8" text-anchor="start" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">0x101 - 0x118</text>
<text x="112" y="96" font-size="10" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">actuator base</text>
<text x="312" y="96" font-size="9.6" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">Direct command in, compact status out.</text>
<rect x="0" y="107" width="300" height="24" rx="4" fill="#e8eef7" stroke="#2563a8" stroke-width="1.0"/>
<text x="10" y="123" font-size="10" fill="#2563a8" text-anchor="start" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">base + 0x100</text>
<text x="112" y="123" font-size="10" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">host control</text>
<text x="312" y="123" font-size="9.6" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">OTA start/end, set ID, diagnostics, version.</text>
<rect x="0" y="134" width="300" height="24" rx="4" fill="#e8eef7" stroke="#2563a8" stroke-width="1.0"/>
<text x="10" y="150" font-size="10" fill="#2563a8" text-anchor="start" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">base + 0x200</text>
<text x="112" y="150" font-size="10" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">unicast data</text>
<text x="312" y="150" font-size="9.6" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">Repairs one board that fell behind the broadcast.</text>
<rect x="0" y="161" width="300" height="24" rx="4" fill="#e8eef7" stroke="#2563a8" stroke-width="1.0"/>
<text x="10" y="177" font-size="10" fill="#2563a8" text-anchor="start" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">base + 0x300</text>
<text x="112" y="177" font-size="10" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">board status</text>
<text x="312" y="177" font-size="9.6" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">Acknowledgements, diagnostics, extended telemetry.</text>
<rect x="0" y="188" width="300" height="24" rx="4" fill="#f0ebf7" stroke="#6b3fa0" stroke-width="1.0"/>
<text x="10" y="204" font-size="10" fill="#6b3fa0" text-anchor="start" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">base + 0x400</text>
<text x="112" y="204" font-size="10" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">extended command</text>
<text x="312" y="204" font-size="9.6" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">TLE only: gains, shaping, current codes. New.</text>
<text x="0" y="236" font-size="10" fill="#2563a8" text-anchor="start" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">compact command / status   DLC 2, little-endian</text>
<rect x="0" y="242" width="216" height="32" rx="3" fill="#e8eef7" stroke="#2563a8" stroke-width="1.1"/><text x="108.0" y="256" font-size="9.5" fill="#1a1f2b" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">bits 0..11</text><text x="108.0" y="268" font-size="8.2" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">pressure, 12-bit counts</text>
<rect x="220" y="242" width="108" height="32" rx="3" fill="#d8e5f4" stroke="#2563a8" stroke-width="1.1"/><text x="274.0" y="256" font-size="9.5" fill="#1a1f2b" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">bits 12..15</text><text x="274.0" y="268" font-size="8.2" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">flags</text>
<text x="0" y="288" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">one count = 0.0165 psi on a TLE board (raw &gt;&gt; 4)</text>
<text x="400" y="236" font-size="10" fill="#b4531f" text-anchor="start" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">target table   DLC 8</text>
<rect x="400" y="242" width="74" height="32" rx="3" fill="#f6efe7" stroke="#b4531f" stroke-width="1.1"/><text x="437.0" y="256" font-size="9.5" fill="#1a1f2b" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">byte 0</text><text x="437.0" y="268" font-size="8.2" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">0x80 | slot</text>
<rect x="478" y="242" width="58" height="32" rx="3" fill="#f6efe7" stroke="#b4531f" stroke-width="1.1"/><text x="507.0" y="256" font-size="9.5" fill="#1a1f2b" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">byte 1</text><text x="507.0" y="268" font-size="8.2" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">3-bit mask</text>
<rect x="540" y="242" width="76" height="32" rx="3" fill="#f7e6d6" stroke="#b4531f" stroke-width="1.1"/><text x="578.0" y="256" font-size="9.5" fill="#1a1f2b" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">2..3</text><text x="578.0" y="268" font-size="8.2" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">slot + 0</text>
<rect x="620" y="242" width="76" height="32" rx="3" fill="#f7e6d6" stroke="#b4531f" stroke-width="1.1"/><text x="658.0" y="256" font-size="9.5" fill="#1a1f2b" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">4..5</text><text x="658.0" y="268" font-size="8.2" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">slot + 1</text>
<rect x="700" y="242" width="76" height="32" rx="3" fill="#f7e6d6" stroke="#b4531f" stroke-width="1.1"/><text x="738.0" y="256" font-size="9.5" fill="#1a1f2b" text-anchor="middle" font-weight="700" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">6..7</text><text x="738.0" y="268" font-size="8.2" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">slot + 2</text>
<text x="400" y="282" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">bit 7 of byte 0 separates a table frame from OTA data,</text>
<text x="400" y="294" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">whose first byte is a sequence number 0..127</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 258" width="100%" role="img" aria-label="The shared CAN bus and its two board types" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d55"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4531f"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b3fa0"/></marker></defs>
<text x="0" y="12" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">Twenty-four actuators, two board types, one protocol</text>
<rect x="8" y="34" width="150" height="62" rx="6" fill="#f6efe7" stroke="#b4531f" stroke-width="1.2"/><text x="83.0" y="62.0" font-size="12" fill="#1a1f2b" text-anchor="middle" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">PC backend</text><text x="83.0" y="76.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">sync master, 150 Hz</text>
<rect x="8" y="100" width="150" height="34" rx="6" fill="#fbfbfd" stroke="#c3c9d4" stroke-width="1.2"/><text x="83.0" y="114.0" font-size="12" fill="#1a1f2b" text-anchor="middle" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">CANable 2.0</text><text x="83.0" y="128.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">slcan, 1 Mbit/s</text>
<line x1="83" y1="96" x2="83" y2="100" stroke="#b4531f" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="20" y1="152" x2="760" y2="152" stroke="#1a1f2b" stroke-width="2.6"/>
<text x="20" y="147" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">CAN  1 Mbit/s</text>
<line x1="83" y1="134" x2="83" y2="150" stroke="#b4531f" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="190" y="178" width="268" height="74" rx="8" fill="#e8eef7" stroke="#2563a8" stroke-width="1.4"/>
<text x="200" y="195" font-size="11" fill="#2563a8" text-anchor="start" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">8 x TLE board  (new)</text>
<text x="200" y="211" font-size="9.5" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">0x101 - 0x108   proportional, Clippard DVP</text>
<text x="200" y="226" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">table groups 0x091 - 0x093</text>
<text x="200" y="242" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">replaces the eight DT big-valve actuators</text>
<line x1="206" y1="152" x2="206" y2="178" stroke="#2563a8" stroke-width="1.2"/>
<line x1="238" y1="152" x2="238" y2="178" stroke="#2563a8" stroke-width="1.2"/>
<line x1="270" y1="152" x2="270" y2="178" stroke="#2563a8" stroke-width="1.2"/>

<line x1="732" y1="152" x2="732" y2="178" stroke="#2f7d55" stroke-width="1.0"/>
<line x1="749" y1="152" x2="749" y2="178" stroke="#2f7d55" stroke-width="1.0"/>
<rect x="190" y="30" width="570" height="110" rx="8" fill="#fff" stroke="#c3c9d4" stroke-width="1.2"/>
<text x="202" y="48" font-size="10.5" fill="#1a1f2b" text-anchor="start" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">every 6.67 ms the host sends</text>
<rect x="202" y="58" width="128" height="32" rx="6" fill="#f6efe7" stroke="#b4531f" stroke-width="1.2"/><text x="266.0" y="71.0" font-size="10" fill="#1a1f2b" text-anchor="middle" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">0x091..0x098</text><text x="266.0" y="85.0" font-size="7.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">8 target frames</text>
<rect x="344" y="58" width="104" height="32" rx="6" fill="#f6efe7" stroke="#b4531f" stroke-width="1.2"/><text x="396.0" y="71.0" font-size="10" fill="#1a1f2b" text-anchor="middle" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">0x090  DLC 0</text><text x="396.0" y="85.0" font-size="7.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">the sync edge</text>
<line x1="330" y1="74" x2="344" y2="74" stroke="#b4531f" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="202" y="110" font-size="9.8" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">and every addressed board answers on its own ID with a 2-byte status</text>
<text x="202" y="126" font-size="9.8" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">pressure latched at the edge, so one host row is one instant across all 24</text>
<rect x="468" y="58" width="130" height="32" rx="6" fill="#e8eef7" stroke="#2563a8" stroke-width="1.2"/><text x="533.0" y="71.0" font-size="10" fill="#1a1f2b" text-anchor="middle" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">reply  DLC 2</text><text x="533.0" y="85.0" font-size="7.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">12-bit + 4 flags</text>
<text x="612" y="70" font-size="9.5" fill="#2563a8" text-anchor="start" font-weight="600" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">1.07 ms median</text>
<text x="612" y="84" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">1.91 ms worst</text>

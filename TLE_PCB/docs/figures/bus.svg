<line x1="334" y1="152" x2="334" y2="178" stroke="#2563a8" stroke-width="1.2"/>
<line x1="366" y1="152" x2="366" y2="178" stroke="#2563a8" stroke-width="1.2"/>
<line x1="398" y1="152" x2="398" y2="178" stroke="#2563a8" stroke-width="1.2"/>
<line x1="430" y1="152" x2="430" y2="178" stroke="#2563a8" stroke-width="1.2"/>
<rect x="486" y="178" width="274" height="74" rx="8" fill="#eaf3ee" stroke="#2f7d55" stroke-width="1.4"/>
<text x="496" y="195" font-size="11" fill="#2f7d55" text-anchor="start" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">16 x VNEMA_MK8 board  (existing)</text>
<text x="496" y="211" font-size="9.5" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">0x109 - 0x118   on/off, Clippard 7 mm</text>
<text x="496" y="226" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">table groups 0x093 - 0x098</text>
<text x="496" y="242" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">firmware unchanged for this work</text>
<line x1="494" y1="152" x2="494" y2="178" stroke="#2f7d55" stroke-width="1.0"/>
<line x1="511" y1="152" x2="511" y2="178" stroke="#2f7d55" stroke-width="1.0"/>

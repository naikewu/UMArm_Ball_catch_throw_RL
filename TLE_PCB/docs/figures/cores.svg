<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="100%" role="img" aria-label="ESP32-S3 task and core map" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d55"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4531f"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b3fa0"/></marker></defs>
<text x="0" y="12" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">One 6 kHz timer is the only clock; the two cores split the bus from the plant</text>
<rect x="0" y="20" width="780" height="26" rx="5" fill="#f6efe7" stroke="#b4531f" stroke-width="1.2"/>
<text x="12" y="38" font-size="12" fill="#b4531f" text-anchor="start" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">GPTimer base tick  6000 Hz</text>
<text x="236" y="38" font-size="10.5" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">/2 -&gt; ADC 3 kHz</text>
<text x="392" y="38" font-size="10.5" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">/4 -&gt; MAX update 1.5 kHz</text>
<text x="596" y="38" font-size="10.5" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">/8 -&gt; PID 750 Hz</text>
<rect x="8" y="62" width="372" height="158" rx="8" fill="#fff" stroke="#c3c9d4" stroke-width="1.2"/>
<text x="20" y="79" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">core 0   bus and control law</text>
<text x="370" y="79" font-size="9" fill="#6b7280" text-anchor="end" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">SPI2: MCP25625 alone</text>
<rect x="18" y="84" width="352" height="32" rx="6" fill="#e8eef7" stroke="#2563a8" stroke-width="1.2"/><text x="194.0" y="97.0" font-size="12" fill="#1a1f2b" text-anchor="middle" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">can   prio 7</text><text x="194.0" y="111.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">MCP INT -&gt; drain RX -&gt; route -&gt; TX slot</text>
<rect x="18" y="120" width="352" height="32" rx="6" fill="#e8eef7" stroke="#2563a8" stroke-width="1.2"/><text x="194.0" y="133.0" font-size="12" fill="#1a1f2b" text-anchor="middle" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">pid   prio 6</text><text x="194.0" y="147.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">750 Hz, consumes the ADC window</text>
<rect x="18" y="156" width="352" height="26" rx="6" fill="#fbfbfd" stroke="#c3c9d4" stroke-width="1.2"/><text x="194.0" y="166.0" font-size="10.5" fill="#1a1f2b" text-anchor="middle" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">usb   prio 3</text><text x="194.0" y="180.0" font-size="8.0" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">text frames on USB-Serial/JTAG</text>
<rect x="18" y="186" width="352" height="26" rx="6" fill="#fbfbfd" stroke="#c3c9d4" stroke-width="1.2"/><text x="194.0" y="196.0" font-size="10.5" fill="#1a1f2b" text-anchor="middle" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">rawdump  prio 2</text><text x="194.0" y="210.0" font-size="8.0" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">ADC capture dump, below everything</text>
<rect x="400" y="62" width="372" height="128" rx="8" fill="#fff" stroke="#c3c9d4" stroke-width="1.2"/>
<text x="412" y="79" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">core 1   sensing and actuation</text>
<rect x="410" y="84" width="352" height="32" rx="6" fill="#eaf3ee" stroke="#2f7d55" stroke-width="1.2"/><text x="586.0" y="97.0" font-size="12" fill="#1a1f2b" text-anchor="middle" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">adc   prio 6</text><text x="586.0" y="111.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">3 kHz LTC1864, outlier-rejected</text>
<rect x="410" y="120" width="352" height="32" rx="6" fill="#eaf3ee" stroke="#2f7d55" stroke-width="1.2"/><text x="586.0" y="133.0" font-size="12" fill="#1a1f2b" text-anchor="middle" font-weight="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">valve prio 5</text><text x="586.0" y="147.0" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">1.5 kHz TLE92464 current update</text>
<text x="412" y="174" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" opacity="1.0">SPI3: TLE92464 + LTC1864 share MOSI/SCK/MISO</text>
<line x1="380" y1="100" x2="410" y2="100" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ahm)"/>
<line x1="410" y1="136" x2="380" y2="136" stroke="#6b7280" stroke-width="1.4" marker-end="url(#ahm)"/>
<text x="395" y="92" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">target</text>
<text x="395" y="152" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">samples</text>
<rect x="8" y="230" width="764" height="54" rx="8" fill="#f0ebf7" stroke="#6b3fa0" stroke-width="1.2"/>
<text x="20" y="247" font-size="10.5" fill="#6b3fa0" text-anchor="start" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">Why the split is this way</text>
<text x="20" y="262" font-size="9.6" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">Separate SPI buses, so CAN traffic and valve current updates never queue behind each other.</text>
<text x="20" y="276" font-size="9.6" fill="#1a1f2b" text-anchor="start" font-weight="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif" opacity="1.0">CAN outranks the control law: the sync edge defines when the whole robot changes target, so servicing it late is worse than running the loop late.</text>
</svg>
